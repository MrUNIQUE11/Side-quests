<!doctype html><html lang="ta"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ஜாதக ஆப் — நூல் நிலை</title><style>:root{--color-fg:#1f1d1a;--color-fg-muted:#6b665e;--color-bg:#faf9f6;--color-panel:#fff;--color-border-line:#e3dfd6;--color-ok:#2e7d4f;--color-warn:#a8650b;--color-bad:#b3261e;--cds-gap-xs:4px;--cds-gap-sm:8px;--cds-gap-md:12px;--cds-gap-lg:20px;--cds-pad-md:12px;--cds-pad-lg:16px;--cds-pad-xl:24px;--cds-radius:10px;--cds-font-size-caption:13px;--cds-font-size-body:15px;--cds-font-size-heading:18px;--cds-font-size-title:26px;--cds-font-weight-medium:600;--font-anthropic-sans:"Noto Sans Tamil",system-ui,sans-serif;--font-anthropic-serif:Georgia,"Noto Serif Tamil",serif;--cds-surface-popover:#fff;--cds-border:#e3dfd6;--cds-shadow-popover:0 4px 14px rgba(0,0,0,.12);--s0:#3f6fd8;--s1:#d9962a}
@media (prefers-color-scheme:dark){:root{--color-fg:#ece9e2;--color-fg-muted:#a39e94;--color-bg:#1c1b19;--color-panel:#262522;--color-border-line:#3a3833;--color-ok:#6cc08f;--color-warn:#e0a54a;--color-bad:#ef7b72;--cds-surface-popover:#2c2b28;--cds-border:#3a3833;--s0:#7aa2f7;--s1:#e6b25a}}
html,body{margin:0;background:var(--color-bg);color:var(--color-fg);font-family:var(--font-anthropic-sans)}
#dash-root{max-width:1200px;margin:0 auto;padding:16px}
.dash-select{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--color-border-line);border-radius:8px;background-color:var(--color-panel);color:var(--color-fg)}
#gate[hidden],#dash-root[hidden]{display:none!important}
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
#gate form{width:100%;max-width:340px;background:var(--color-panel);border:1px solid var(--color-border-line);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:12px}
#gate h1{font-family:var(--font-anthropic-serif);font-weight:400;font-size:24px;margin:0}
#gate label{font-size:13px;color:var(--color-fg-muted);display:flex;flex-direction:column;gap:6px}
#gate input{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--color-border-line);border-radius:8px;background:var(--color-bg);color:var(--color-fg)}
#gate button{font:inherit;font-size:16px;padding:11px;border:0;border-radius:8px;background:var(--color-fg);color:var(--color-bg);cursor:pointer}
#gate button:disabled{opacity:.6}
#gerr{color:var(--color-bad);font-size:13px;min-height:1.2em;margin:0}
#out{position:fixed;bottom:12px;right:12px;font:inherit;font-size:12px;padding:6px 10px;border:1px solid var(--color-border-line);border-radius:999px;background:var(--color-panel);color:var(--color-fg-muted);cursor:pointer;z-index:50}
</style><style>

.pj{font-family:var(--font-anthropic-sans);color:var(--color-fg);display:flex;flex-direction:column;gap:var(--cds-gap-lg)}
.pj h1{font-family:var(--font-anthropic-serif);font-weight:400;font-size:var(--cds-font-size-title);margin:0;line-height:1.25}
.pj h2{font-size:var(--cds-font-size-heading);font-weight:var(--cds-font-weight-medium);margin:0 0 var(--cds-gap-sm)}
.pj h3{font-size:var(--cds-font-size-body);font-weight:var(--cds-font-weight-medium);margin:0}
.pj-lead{margin:var(--cds-gap-sm) 0 0;line-height:1.7;color:var(--color-fg)}
.pj-lead b{font-variant-numeric:tabular-nums}
.pj-muted{color:var(--color-fg-muted);font-size:var(--cds-font-size-caption);line-height:1.6}
.pj-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:var(--cds-gap-md)}
.pj-card{background:var(--color-panel);border:1px solid var(--color-border-line);border-radius:var(--cds-radius);padding:var(--cds-pad-lg)}
.pj-kpi .v{font-family:var(--font-anthropic-serif);font-weight:400;font-size:2rem;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:var(--cds-gap-xs);display:block;min-height:1.1em}
.pj-kpi .l{font-size:var(--cds-font-size-caption);color:var(--color-fg-muted)}
.pj-kpi.ok .v{color:var(--color-ok)} .pj-kpi.warn .v{color:var(--color-warn)} .pj-kpi.bad .v{color:var(--color-bad)}
.pj-tabs{display:flex;flex-wrap:wrap;gap:var(--cds-gap-xs);border-bottom:1px solid var(--color-border-line);padding-bottom:var(--cds-gap-sm)}
.pj-tab{font:inherit;font-size:var(--cds-font-size-caption);background:transparent;color:var(--color-fg-muted);border:1px solid var(--color-border-line);border-radius:999px;padding:6px 12px;cursor:pointer}
.pj-tab.on{background:var(--color-fg);color:var(--color-bg);border-color:var(--color-fg)}
.pj-sec{display:flex;flex-direction:column;gap:var(--cds-gap-md)}
.pj-bar{display:flex;flex-wrap:wrap;gap:var(--cds-gap-sm);align-items:center}
.pj-search{font:inherit;font-size:var(--cds-font-size-caption);padding:6px 10px;border:1px solid var(--color-border-line);border-radius:var(--cds-radius);background:var(--color-bg);color:var(--color-fg);min-width:0;flex:1 1 160px}
.pj-books{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:var(--cds-gap-md)}
@container pjroot (max-width:420px){.pj-books{grid-template-columns:1fr}}
.pj{container:pjroot/inline-size}
.pj-book{display:flex;flex-direction:column;gap:var(--cds-gap-sm)}
.pj-book .hd{display:flex;justify-content:space-between;gap:var(--cds-gap-sm);align-items:flex-start}
.pj-book .meta{font-size:var(--cds-font-size-caption);color:var(--color-fg-muted)}
.pj-book dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:var(--cds-font-size-caption);line-height:1.6}
.pj-book dt{color:var(--color-fg-muted);white-space:nowrap}
.pj-book dd{margin:0}
.pj-badge{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap;flex:none}
.pj-badge.ok{color:var(--color-ok)} .pj-badge.warn{color:var(--color-warn)} .pj-badge.bad{color:var(--color-bad)} .pj-badge.mut{color:var(--color-fg-muted)}
.pj-tw{overflow-x:auto;container:pjtw/inline-size}
.pj-t{width:100%;border-collapse:collapse;font-size:var(--cds-font-size-caption);line-height:1.6}
.pj-t th{text-align:left;font-weight:var(--cds-font-weight-medium);color:var(--color-fg-muted);border-bottom:1px solid var(--color-border-line);padding:6px 8px;white-space:nowrap}
.pj-t td{border-bottom:1px solid var(--color-border-line);padding:7px 8px;vertical-align:top}
.pj-t td.n{font-variant-numeric:tabular-nums;color:var(--color-fg-muted);white-space:nowrap}
.pj-t td.nw{white-space:nowrap}
@container pjtw (max-width:560px){
 .pj-t thead{display:none}
 .pj-t tr{display:block;border-bottom:1px solid var(--color-border-line);padding:6px 0}
 .pj-t td{display:block;border:0;padding:2px 4px}
 .pj-t td::before{content:attr(data-label);color:var(--color-fg-muted);margin-right:6px}
 .pj-t td.nw{white-space:normal}
}
.pj-chart{position:relative;min-height:180px}
.pj-hb{display:grid;grid-template-columns:minmax(80px,max-content) 1fr;gap:6px 10px;align-items:center;font-size:var(--cds-font-size-caption)}
.pj-hb .lab{color:var(--color-fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw}
.pj-hb .trk{display:flex;align-items:center;gap:6px;min-width:0}
.pj-hb .fill{height:16px;border-radius:3px;min-width:2px}
.pj-hb .num{font-variant-numeric:tabular-nums;color:var(--color-fg-muted)}
.pj-tip{position:absolute;pointer-events:none;background:var(--cds-surface-popover);border:1px solid var(--cds-border);box-shadow:var(--cds-shadow-popover);border-radius:var(--cds-radius);padding:6px 10px;font-size:var(--cds-font-size-caption);color:var(--color-fg)}
.pj-map{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:var(--cds-gap-md)}
@container pjroot (max-width:420px){.pj-map{grid-template-columns:1fr}}
.pj-map ul{margin:var(--cds-gap-sm) 0 0;padding-left:18px;font-size:var(--cds-font-size-caption);line-height:1.6}
.pj-map li{margin-bottom:4px}
.pj-map .src{color:var(--color-fg-muted)}
.pj-pol ul{margin:0;padding-left:18px;line-height:1.7;font-size:var(--cds-font-size-caption)}
.pj-two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:var(--cds-gap-md)}
[data-dash-source-state=refreshing]{opacity:.5}
.pj-kpi{font:inherit;text-align:left;cursor:pointer;color:inherit;display:block;width:100%;transition:border-color .15s}
.pj-kpi:hover,.pj-kpi:focus-visible{border-color:var(--color-fg-muted);outline:none}
.pj-kpi.on{border-color:var(--color-fg);box-shadow:inset 0 0 0 1px var(--color-fg)}
.pj-kpi .go{display:block;font-size:11px;color:var(--color-fg-muted);margin-top:var(--cds-gap-xs)}
.pj-hint{margin:0}
.pj-sec{scroll-margin-top:12px}
.pj-books{align-items:start}
details.pj-book{padding:0}
details.pj-book>summary{list-style:none;cursor:pointer;padding:var(--cds-pad-lg)}
details.pj-book>summary::-webkit-details-marker{display:none}
details.pj-book>summary .hd::after{content:"▾";color:var(--color-fg-muted);margin-left:6px;flex:none}
details.pj-book[open]>summary .hd::after{content:"▴"}
details.pj-book dl{padding:0 var(--cds-pad-lg) var(--cds-pad-lg)}
details.pj-grp{border:1px solid var(--color-border-line);border-radius:var(--cds-radius);background:var(--color-panel)}
details.pj-grp>summary{cursor:pointer;padding:10px 14px;font-weight:var(--cds-font-weight-medium);display:flex;justify-content:space-between;gap:8px}
details.pj-grp>summary .c{color:var(--color-fg-muted);font-weight:400;font-variant-numeric:tabular-nums}
details.pj-grp>.pj-tw,details.pj-grp>ul{padding:0 14px 12px}
.pj-grps{display:flex;flex-direction:column;gap:var(--cds-gap-sm)}
.pj-map{align-items:start}
.pj-hb .lab,.pj-hb .trk{cursor:pointer}

.pj-acc{display:flex;flex-direction:column;gap:var(--cds-gap-sm)}
details.pj-sect{border:1px solid var(--color-border-line);border-radius:var(--cds-radius);background:var(--color-panel);scroll-margin-top:12px}
details.pj-sect>summary{cursor:pointer;list-style:none;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:var(--cds-font-size-heading);font-weight:var(--cds-font-weight-medium)}
details.pj-sect>summary::-webkit-details-marker{display:none}
details.pj-sect>summary>span:first-child{flex:1}
.pj-book .pj-badge{white-space:normal;max-width:45%;text-align:center}
details.pj-sect>summary .c{color:var(--color-fg-muted);font-weight:400;font-variant-numeric:tabular-nums;font-size:var(--cds-font-size-body)}
details.pj-sect>summary::after{content:"▾";color:var(--color-fg-muted);font-size:14px}
details.pj-sect[open]>summary::after{content:"▴"}
details.pj-sect[open]>summary{border-bottom:1px solid var(--color-border-line)}
.pj-in{padding:var(--cds-pad-lg);display:flex;flex-direction:column;gap:var(--cds-gap-md)}
.pj-in .pj-card{background:var(--color-bg)}
.pj-short{min-height:90px}
.pj-stack{display:flex;height:30px;border-radius:6px;overflow:hidden;gap:2px;margin-top:4px}
.pj-stack .seg{cursor:pointer;min-width:6px}
.pj-stack .seg.ok,.pj-sleg .sw.ok{background:var(--color-ok)} .pj-stack .seg.warn,.pj-sleg .sw.warn{background:var(--color-warn)}
.pj-stack .seg.bad,.pj-sleg .sw.bad{background:var(--color-bad)} .pj-stack .seg.mut,.pj-sleg .sw.mut{background:var(--color-fg-muted)}
.pj-sleg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:var(--cds-font-size-caption)}
.pj-sleg .li{font:inherit;background:none;border:0;color:var(--color-fg);padding:2px 0;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.pj-sleg b{font-variant-numeric:tabular-nums}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;flex:none}
.pj-leg{display:flex;gap:14px;font-size:var(--cds-font-size-caption);color:var(--color-fg-muted);margin:4px 0 8px}
.pj-leg span{display:inline-flex;align-items:center;gap:6px}
.pj-vb{display:flex;align-items:stretch;gap:6px;height:180px;overflow-x:auto;padding-top:18px}
.pj-vb .col{flex:1 0 34px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:default}
.pj-vb .bars{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:3px;border-bottom:1px solid var(--cds-chart-axis,var(--color-border-line))}
.pj-vb .b{width:42%;max-width:16px;border-radius:3px 3px 0 0;position:relative;min-height:0}
.pj-vb .n{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:10.5px;color:var(--color-fg-muted);font-variant-numeric:tabular-nums;padding-bottom:1px}
.pj-vb .x{font-size:11px;color:var(--color-fg-muted);font-variant-numeric:tabular-nums;white-space:nowrap}
